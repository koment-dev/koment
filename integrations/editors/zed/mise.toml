[tools]
rust = { version = "1.97.1", targets = "wasm32-wasip2" }

[tasks.build]
description = "Compile the Zed extension to WebAssembly"
run = "cargo build --release --target wasm32-wasip2"

[tasks.check]
description = "Reject a Zed extension that does not compile or is unformatted"
run = [
  "cargo fmt --check",
  "cargo clippy --target wasm32-wasip2 -- -D warnings",
]
