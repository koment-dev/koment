  type: why
  title: The column has no height of its own; this is where it gets one
  body: |-
    Every note in the aligned layout is `position: absolute`, so the gloss has
    zero intrinsic height and `.reading` — a grid with `align-items: start`
    — sizes its row from the code column alone.

    Without this line the notes simply hang below the code once their stacked
    height exceeds the file's, with an empty column beside them and only
    `.reading`'s bottom padding absorbing any of it. On a short file carrying
    long rationale that is most of the page.

    `floor` is already the exact bottom of the last placed note, so the
    container can be told what it is rather than measured again.
  anchor:
