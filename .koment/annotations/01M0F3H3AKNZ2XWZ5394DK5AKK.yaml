spec:
  target:
    file: .github/workflows/ci.yml
  type: invariant
  title: Restore Go caches before mise installs Go tools
  body: |-
    The quality, lint and test jobs restore the Go cache before Setup Mise.
    Setup Mise installs locked Go-based tools such as govulncheck and therefore
    writes modules into ~/go/pkg/mod. Restoring actions/cache afterwards makes
    GNU tar refuse to overwrite those files, discards the entire cache and
    leaves a successful job with a repeatable warning. Keep this order in every
    job that combines the shared Go cache with a full mise install.
  anchor:
    scope: excerpt
    excerpt: |2-
        quality:
          name: quality
          runs-on: ubuntu-24.04
          permissions:
            contents: read
          steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: Cache Go
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                path: |
                  ~/.cache/go-build
                  ~/go/pkg/mod
                key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
                restore-keys: ${{ runner.os }}-go-

            - name: Setup Mise
              uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
              with:
                experimental: true
                install_args: --locked
    before: |2-
        MISE_DISABLE_TOOLS: github:koment-dev/koment

      jobs:
    after: |2-

            - name: Check formatting
              run: mise run fmt-check
