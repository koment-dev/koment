spec:
  target:
    file: .github/workflows/ci.yml
  type: why
  title: CI never installs the contributor self-pin
  body: |-
    The root mise configuration pins a released koment only for contributor
    editor and MCP sessions. Every repository gate runs the working tree through
    Go and does not consume that pin. A cold CI cache previously installed and
    attested the unused binary independently in each job; the concurrent GitHub
    API calls exhausted the installation rate limit and failed every real gate
    before it ran. Disabling only this tool keeps the contributor pin active
    locally while making CI install exactly the tools its jobs can use.
  anchor:
    scope: excerpt
    excerpt: |-
      env:
        MISE_DISABLE_TOOLS: github:koment-dev/koment
    before: |
      permissions:
        contents: read
    after: |2-

      jobs:
        quality:
