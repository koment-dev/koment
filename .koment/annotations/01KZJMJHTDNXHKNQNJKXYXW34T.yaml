  type: why
  title: Asking for help exits 0; failing to parse exits 2
  body: |-
    parse exists so that one decision is made in one place: asking for help is a
    successful invocation, and failing to parse is not. flag.Parse reports both
    through the same error, and the obvious `if err != nil { return ExitUsage }`
    silently makes `koment add --help` exit 2 — which breaks any script or CI
    step that asks a command how it works.

    Every command routes through here rather than calling flags.Parse directly,
    so a new command cannot reintroduce the difference by accident.
