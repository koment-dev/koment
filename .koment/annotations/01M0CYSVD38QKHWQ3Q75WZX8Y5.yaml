spec:
  target:
    file: integrations/editors/zed/Cargo.toml
  type: gotcha
  title: This version is deliberately frozen; extension.toml carries the real one
  body: |-
    Do not sync this with the repository version, and do not add
    `release-please` markers here (ADR 0139).

    `Cargo.lock` repeats the package version, cargo rewrites that file on every
    build, and it would strip the marker comments `release-please` needs.
    Bumping the manifest without the lock leaves them disagreeing from the first
    build after each release, and a `--locked` build fails outright.

    The crate is `publish = false`, so this number has no consumer. The version
    Zed shows and the registry resolves lives in `extension.toml`, which does
    carry the markers and is listed in `release-please-config.json`. The `zed`
    CI job asserts it matches `.release-please-manifest.json`.
  anchor:
    scope: excerpt
    excerpt: version = "0.0.0"
    before: |-
      [package]
      name = "koment_zed"
    after: |-
      edition = "2021"
      license = "AGPL-3.0-or-later"
      publish = false
  author:
    name: claude-code
    kind: agent
    source: session
