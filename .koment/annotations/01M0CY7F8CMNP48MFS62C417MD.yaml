spec:
  target:
    file: internal/ui/assets/koment.js
  type: gotcha
  title: Add .aligned before measuring, or the first paint is wrong
  body: |-
    The order of these three lines is load-bearing and looks arbitrary.

    `resting` below is `note.offsetTop`, and what that returns depends on
    whether `.aligned` is already on the gloss. Without it the notes are in flow
    and `offsetTop` is their stacked position; with it they are absolute, their
    static position collapses to roughly zero, and `offsetTop` reports that
    instead.

    This used to add `.aligned` at the *end*, after measuring. Every offset was
    therefore computed against the flow layout and then applied to the absolute
    one, so the first paint placed each note at `placed - resting` rather than
    `placed`. It self-corrected on the second run, which `document.fonts.ready`
    happens to trigger — meaning the bug showed as a visible jump rather than
    a wrong layout, and only when a font was still loading.

    The height is cleared before measuring for the same reason: a height left
    over from the previous run must not be part of the layout being measured.
  anchor:
    scope: excerpt
    excerpt: |2-
            column();
            gloss.classList.add("aligned");
            gloss.style.height = "";
    before: |2
              return;
            }
    after: |2-
            notes.forEach(function (note) {
              note.style.transform = "";
            });
