spec:
  target:
    file: .github/workflows/ci.yml
  type: invariant
  title: Plugin manifests must match release-please version exactly
  body: |-
    Every manifest that carries a version must pin the exact value in
    .release-please-manifest.json rather than drift toward it. A mismatch would
    mean the release attaches archives stamped with a version release-please
    never wrote to the file, which silently breaks anyone pinning a file://
    reference against the tag.

    The `jq -re '.["."]'` is the whole check. This read `jq -r '.version'` until
    2026-08-19, and that key does not exist — the manifest is `{".":
    "3.0.0"}`. It returned the string "null", the guard below it was written as
    `if [ -n "$root_version" ]`, and so the comparison was skipped on every run
    since the job was written. The gate this annotation described had never once
    fired.

    `-re` is deliberate: `-e` exits non-zero if the key is missing, so the same
    mistake now fails the job instead of quietly disabling it. Do not soften it
    back to a presence check.
  anchor:
    scope: excerpt
    excerpt: |2-
                  root_version=$(jq -re '.["."]' .release-please-manifest.json)
                  if [ "$version" != "$root_version" ]; then
    before: |2-
                  entrypoint=$(jq -r '.entrypoint // empty' "$manifest")
                  test -n "$name"    || { echo "::error::$manifest: name is empty";    exit 1; }
                  test -n "$version" || { echo "::error::$manifest: version is empty"; exit 1; }
    after: |2-
                    echo "::error::$manifest version ($version) does not match root ($root_version)"
                    exit 1
                  fi
  author:
    name: opencode
    kind: agent
    source: session
