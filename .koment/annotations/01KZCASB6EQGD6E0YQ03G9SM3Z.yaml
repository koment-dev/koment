  target:
    file: .github/workflows/release.yml
  type: why
  title: Plugins wait for canonical artifacts
  body: |-
    ADRs 0109 and 0129 require canonical artifacts to exist before downstream
    channels publish. The plugin source does not consume the Go archives or
    image, but npm and the agent archives still wait for both jobs so they can
    never become the only successful artifacts for a broken release. The job
    retains id-token: write because cosign keyless signing otherwise falls back
    to an interactive device flow on a non-interactive runner.
  anchor:
    scope: excerpt
    excerpt: |-
      plugins:
          name: publish plugins
          needs: [please, binaries, image]
    before: |2
                config-file: release-please-config.json
                manifest-file: .release-please-manifest.json
    after: |2-
          if: needs.please.outputs.released == 'true'
          runs-on: ubuntu-24.04
          permissions:
