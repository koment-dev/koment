  title: The page's prose lives here so no half of it can rot
  body: |-
    Writing prose inside a Go string literal is worse than writing it in
    Markdown, and that is the deliberate trade (ADR 0140).

    Splitting it — a generated table included into a hand-written page — was
    rejected because the prose makes claims *about* the table: "these work in
    every filetype below", "only the formats in Never scanned report no comment
    detector". Those sentences are exactly the ones that go stale when the table
    changes, so the half left hand-written would be the half that rots.

    If you are here to move this text into a `.md` file, read ADR 0140 first.
    The page it would create is the page this repository already deleted once.
