  type: why
  title: MCP shutdown errors remain visible
  body: |-
    Ending stdin is the intentional shutdown signal for the stdio server. The
    returned promise makes a stream failure part of the dispose gate instead of
    swallowing it; a child that exited earlier is already represented by the
    connection's terminal error.
  anchor:
    scope: excerpt
    excerpt: |2-
