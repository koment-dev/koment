spec:
  target:
    file: docs/guides/release-koment.md
  type: why
  title: Plugins publish only after canonical artifacts
  body: |-
    The plugins job is listed separately because it produces source-only
    artifacts and an npm package, but ADRs 0109 and 0129 still order it after
    both canonical binary and image publication. That dependency prevents an
    npm package or agent archive from being the only successful artifact for a
    broken release. The job needs id-token: write for cosign because a missing
    OIDC credential falls back to an interactive device flow on a
    non-interactive runner.
  anchor:
    scope: excerpt
    excerpt: '| `plugins` | Three self-contained plugin archives (Claude, Hermes and OpenCode), per-archive cosign signatures, a combined `koment-plugins_<version>_checksums.txt`, and its cosign signature; the OpenCode package also goes to npm |'
    before: |-
      | Job | Publishes |
      |---|---|
      | `binaries` | six archives, `koment_<version>_checksums.txt`, a cosign signature, and rendered Homebrew/Scoop/WinGet metadata |
    after: |-
      | `image` | `ghcr.io/koment-dev/koment:<version>`, multi-arch, SBOM and provenance, cosign-signed |
      | `editor` | seven VSIX — six carrying that platform's released binary, one universal — signed, attached, then pushed to both marketplaces |
      | `tap` | the rendered formula in `koment-dev/homebrew-tap` after the binary assets exist |
  author:
    name: opencode
    kind: agent
    source: session
