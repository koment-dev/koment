  target:
    file: internal/commentpolicy/support.go
  type: why
  title: These exports have one caller, and it is the manual
  body: |-
    Nothing in koment's own execution path calls these. They exist so
    `internal/commentpolicy/gen` can render docs/reference/languages.md from the
    tables that decide behaviour rather than from someone's memory of them (ADR
    0140).

    That makes them look like dead code to a reader trimming the API surface.
    They are not: deleting one breaks `go generate ./...`, which the
    `generate-check` task runs and which fails CI on a dirty tree.

    Every accessor copies before returning. A caller that mutated the result
    would be editing the live comment policy, and support_test.go asserts the
    copy.
  anchor:
