spec:
  target:
    file: .github/workflows/ci.yml
  type: anti-pattern
  title: Published-release checks remain advisory
  body: |-
    windows-archive and setup-action exercise the last published release rather
    than this pull request. Their failures can describe a runner-image change,
    a GitHub download outage or a release problem without saying anything about
    the commit under review. They remain visible jobs, but putting either in the
    ci needs list would make external release state a code-merge requirement.
  anchor:
    scope: excerpt
    excerpt: |2-
            - plugins
            - quality
            - test
            - zed
    before: |2-
            - helm
            - lint
