  type: anti-pattern
  title: Do not expose remaining as API
  body: |-
    remaining is unexported on purpose. Callers that branch on a raw duration
    reimplement the renewal policy at each call site, and they drift apart the
    moment the window changes. Ask Renewable instead: the policy lives in one
    place and the constant beside it.
  anchor:
    scope: excerpt
    excerpt: func (t Token) remaining(now time.Time) time.Duration {
    before: "\treturn t.Expiry.Before(now.Add(-clockSkew))\n}\n"
    after: "\treturn t.Expiry.Sub(now)\n}\n"
